name: ARTISANLY CI

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Lint Codebase
        run: npm run lint

      - name: Run Database Rules & Invariants Suite
        run: npm run test:db-rules

      - name: Run Seller Product Management Suite
        run: npm run test:seller-products

      - name: Run Multi-Vendor Checkout & Payments Suite
        run: npm run test:multivendor

      - name: Start Next.js Development Server for API Suite
        run: |
          npm run dev &
          npx wait-on -t 30000 http://localhost:3000/api/health

      - name: Run Payments & Legal Reviews Suite
        run: npm run test:payments-legal

      - name: Run System Health, Backups & Telemetry Suite
        run: npm run test:system

      - name: Build Production Application
        run: npm run build
