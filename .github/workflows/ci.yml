name: ARTISANLY CI

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/artsinly?schema=public"
      AUTH_SECRET: "artsinly-dev-secret-key-32-chars-minimum-token"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NODE_ENV: "test"
      PORT: 3000

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm install --prefer-offline --no-audit

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Lint Codebase
        run: npm run lint

      - name: Run Database Rules & Invariants Suite
        run: npm run test:db-rules

      - name: Run Multi-Vendor Checkout & Payments Suite
        run: npm run test:multivendor

      - name: Start Next.js Development Server for API Suite
        run: |
          npm run dev &
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/api/health | grep -q "healthy"; then
              echo "Server is healthy on port 3000!"
              break
            fi
            echo "Waiting for server to start... ($i/30)"
            sleep 1
          done

      - name: Run Seller Product Management Suite
        run: npm run test:seller-products

      - name: Run Payments & Legal Reviews Suite
        run: npm run test:payments-legal

      - name: Run System Health, Backups & Telemetry Suite
        run: npm run test:system

      - name: Build Production Application
        run: npm run build
